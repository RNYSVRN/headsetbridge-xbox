[package]
name = "headsetbridge-engine"
version = "2.0.0"
edition = "2021"
publish = false
description = "Audio-only Xbox Remote Play client used by the HeadsetBridge desktop app"
license = "MIT"

[dependencies]
bytes = "1"
serde_json = { version = "1", features = ["preserve_order"] } # keep the key order of Greenlight's config.json
# Single-threaded runtime; `macros` is needed for `select!` and `pin!`.
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "io-util"] }
# HTTPS through Windows Schannel (native-tls): no OpenSSL DLL next to the exe.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }
webrtc = "=0.13.0"
# libopus (static, built by audiopus_sys with cmake) and WASAPI shared-mode output.
opus = "0.3"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
